<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor PDF PRO V5 - Estilo Excel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#09090b;color:#fff;display:flex;flex-direction:column;height:100vh}
.top{background:#18181b;border-bottom:1px solid #27272a;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:sticky;top:0;z-index:100}
.top button{padding:8px 12px;border-radius:8px;border:1px solid #27272a;background:#27272a;color:#fff;font-weight:800;font-size:11px;cursor:pointer}
.top button.verde{background:#16a34a}.top button.amarillo{background:#eab308;color:#000}.top button.rojo{background:#f43f5e}
#viewer{flex:1;overflow:auto;background:#000;display:flex;flex-direction:column;align-items:center;padding:10px;gap:14px}
.page-wrap{position:relative;background:#fff;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.page-wrap canvas{display:block;max-width:92vw}
.draggable{position:absolute;z-index:20;touch-action:none;cursor:move}
.img-box{left:30px;top:30px;width:120px;height:80px;border:2px dashed #f43f5e;background:rgba(0,0,0,.1)}
.txt-cont{left:40px;top:60px;min-width:120px}
.txt-box{min-width:100%;min-height:32px;padding:6px 10px;border:1.5px dashed #16a34a;background:var(--bg,#ffeb3b);color:var(--fg,#000);font-size:18px;font-weight:700;outline:none;border-radius:6px;white-space:pre-wrap}
.txt-toolbar{position:absolute;top:-42px;left:0;display:flex;gap:4px;background:#1f1f23;padding:4px 6px;border-radius:10px;border:1px solid #444;align-items:center}
.txt-toolbar select,.txt-toolbar input{border-radius:6px;border:1px solid #444;background:#27272a;color:#fff;padding:4px;font-size:12px}
</style>
</head>
<body>
<div class="top">
<input type="file" id="pdfInput" accept="application/pdf" style="font-size:11px">
<button onclick="addImage()">🖼️ Imagen</button>
<button class="amarillo" onclick="addText()">✏️ Texto Excel</button>
<button onclick="zoomIn()">🔍+</button>
<button onclick="zoomOut()">🔍-</button>
<button onclick="deletePage()">🗑️ Pág</button>
<button class="rojo" onclick="savePDF()">💾 GUARDAR</button>
<span style="font-size:10px;color:#71717a">Estilo como tu captura</span>
</div>
<div id="viewer"></div>
<input type="file" id="imgInput" accept="image/*" style="display:none">
<script>
let zoom=1.2, pdfDoc=null, pdfLibDoc=null, currentPage=0, pages=[];
const viewer=document.getElementById('viewer');
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

document.getElementById('pdfInput').addEventListener('change',async e=>{
 const file=e.target.files[0]; if(!file) return;
 const pdfBytes=await file.arrayBuffer();
 pdfLibDoc=await PDFLib.PDFDocument.load(pdfBytes);
 pdfDoc=await pdfjsLib.getDocument({data:pdfBytes}).promise;
 renderAll();
});
async function renderAll(){
 viewer.innerHTML=''; pages=[];
 for(let i=1;i<=pdfDoc.numPages;i++){
  const page=await pdfDoc.getPage(i);
  const viewport=page.getViewport({scale:zoom});
  const wrap=document.createElement('div'); wrap.className='page-wrap';
  const canvas=document.createElement('canvas'); const ctx=canvas.getContext('2d');
  canvas.width=viewport.width; canvas.height=viewport.height;
  await page.render({canvasContext:ctx,viewport}).promise;
  wrap.appendChild(canvas);
  wrap.onclick=()=>{currentPage=i-1; document.querySelectorAll('.page-wrap').forEach(p=>p.style.outline=''); wrap.style.outline='3px solid #16a34a';}
  viewer.appendChild(wrap);
  pages.push({wrap,canvas});
 }
}
function addImage(){
 if(!pages[currentPage]) return alert('Carga PDF primero may');
 document.getElementById('imgInput').click();
}
document.getElementById('imgInput').addEventListener('change',async e=>{
 const file=e.target.files[0]; if(!file) return;
 const url=URL.createObjectURL(file);
 const wrap=pages[currentPage].wrap;
 const box=document.createElement('div'); box.className='draggable img-box';
 box.style.left='30px'; box.style.top='30px';
 box.innerHTML=`<img src="${url}" style="width:100%;height:100%;object-fit:contain;pointer-events:none"><div class="handle" style="position:absolute;right:-8px;bottom:-8px;width:18px;height:18px;background:#f43f5e;border-radius:50%;border:2px solid #fff"></div>`;
 box.onpointerdown=startDrag; box.ondblclick=()=>box.remove();
 wrap.appendChild(box);
});
function addText(){
 if(!pages[currentPage]) return alert('Carga PDF primero');
 const wrap=pages[currentPage].wrap;
 const cont=document.createElement('div'); cont.className='draggable txt-cont';
 cont.innerHTML=`
 <div class="txt-toolbar">
  <select onchange="this.parentElement.nextElementSibling.style.fontSize=this.value+'px'"><option value="14">11</option><option value="18" selected>14</option><option value="24">18</option><option value="32">24</option><option value="48">32</option></select>
  <button onclick="fmt(this,'bold')" style="font-weight:900;padding:4px 8px">I</button>
  <button onclick="fmt(this,'italic')" style="font-style:italic;padding:4px 8px">I</button>
  <button onclick="fmt(this,'underline')" style="text-decoration:underline;padding:4px 8px">U</button>
  <label style="display:flex;align-items:center;gap:2px;font-size:10px">A<input type="color" value="#000000" oninput="this.parentElement.parentElement.nextElementSibling.style.color=this.value; this.parentElement.parentElement.nextElementSibling.style.setProperty('--fg',this.value)" style="width:22px;height:22px"></label>
  <label style="display:flex;align-items:center;gap:2px;font-size:10px">🎨<input type="color" value="#ffeb3b" oninput="this.parentElement.parentElement.nextElementSibling.style.background=this.value; this.parentElement.parentElement.nextElementSibling.style.setProperty('--bg',this.value)" style="width:22px;height:22px"></label>
  <button onclick="this.parentElement.parentElement.remove()" style="background:#f43f5e;color:#fff;border:0;border-radius:6px;padding:4px 8px">X</button>
 </div>
 <div class="txt-box" contenteditable="true" style="--bg:#ffeb3b;--fg:#000">TEXTO NIVEL DIOS</div>`;
 cont.onpointerdown=startDrag;
 wrap.appendChild(cont);
}
function fmt(btn,type){
 const box=btn.parentElement.nextElementSibling;
 if(type=='bold') box.style.fontWeight=box.style.fontWeight=='800'?'400':'800';
 if(type=='italic') box.style.fontStyle=box.style.fontStyle=='italic'?'normal':'italic';
 if(type=='underline') box.style.textDecoration=box.style.textDecoration=='underline'?'none':'underline';
}
let drag=null, isResizing=false;
function startDrag(e){
 if(e.target.closest('.txt-toolbar')) return;
 const isHandle=e.target.classList.contains('handle');
 isResizing=isHandle;
 const target=e.currentTarget;
 drag={el:target,x:e.clientX,y:e.clientY,w:target.offsetWidth,h:target.offsetHeight,left:parseInt(target.style.left)||0,top:parseInt(target.style.top)||0};
 target.setPointerCapture(e.pointerId);
}
window.addEventListener('pointermove',e=>{
 if(!drag) return;
 if(isResizing){
  drag.el.style.width=Math.max(40,drag.w+e.clientX-drag.x)+'px';
  drag.el.style.height=Math.max(40,drag.h+e.clientY-drag.y)+'px';
 }else{
  drag.el.style.left=(drag.left+e.clientX-drag.x)+'px';
  drag.el.style.top=(drag.top+e.clientY-drag.y)+'px';
 }
});
window.addEventListener('pointerup',()=>{drag=null;isResizing=false;});
function zoomIn(){zoom+=0.2; renderAll();}
function zoomOut(){zoom=Math.max(0.4,zoom-0.2); renderAll();}
function deletePage(){if(pages[currentPage] && confirm('¿Borrar página '+(currentPage+1)+'?')) pages[currentPage].wrap.remove();}
async function savePDF(){
 if(!pdfLibDoc) return alert('Carga PDF primero may');
 const newDoc=await PDFLib.PDFDocument.create();
 const font=await newDoc.embedFont(PDFLib.StandardFonts.Helvetica);
 const fontBold=await newDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
 const vivos=pages.map((p,i)=>({p,i})).filter(o=>document.body.contains(o.p.wrap));
 const indices=vivos.map(o=>o.i);
 const copied=await newDoc.copyPages(pdfLibDoc,indices);
 for(let k=0;k<copied.length;k++){
  const pg=copied[k]; const wrap=vivos[k].p.wrap;
  // Imagenes
  for(const box of wrap.querySelectorAll('.img-box')){
   const imgEl=box.querySelector('img');
   const bytes=await fetch(imgEl.src).then(r=>r.arrayBuffer());
   let embed; try{embed=await newDoc.embedPng(bytes);}catch{embed=await newDoc.embedJpg(bytes);}
   const {width,height}=pg.getSize();
   const x=(parseInt(box.style.left)/wrap.clientWidth)*width;
   const w=(parseInt(box.style.width)/wrap.clientWidth)*width;
   const h=(parseInt(box.style.height)/wrap.clientHeight)*height;
   const y=height-((parseInt(box.style.top)/wrap.clientHeight)*height)-h;
   pg.drawImage(embed,{x,y,width:w,height:h});
  }
  // Textos con color de relleno y fuente como tu captura
  for(const t of wrap.querySelectorAll('.txt-box')){
   const cont=t.parentElement;
   const {width,height}=pg.getSize();
   const x=(parseInt(cont.style.left)/wrap.clientWidth)*width;
   const yTop=(parseInt(cont.style.top)/wrap.clientHeight)*height;
   const w=(t.offsetWidth/wrap.clientWidth)*width;
   const h=(t.offsetHeight/wrap.clientHeight)*height;
   const y=height-yTop-h;
   const bg = getComputedStyle(t).backgroundColor;
   const m=bg.match(/\d+/g);
   if(m){ pg.drawRectangle({x,y,width:w,height:h,color:PDFLib.rgb(m[0]/255,m[1]/255,m[2]/255)}); }
   const fontSize=Math.max(8,parseInt(t.style.fontSize)||14);
   const color=t.style.color||'#000000';
   const r=parseInt(color.slice(1,3),16)/255||0, g=parseInt(color.slice(3,5),16)/255||0, b=parseInt(color.slice(5,7),16)/255||0;
   const useFont = (t.style.fontWeight=='800')?fontBold:font;
   pg.drawText(t.innerText||' ',{x:x+4,y:y+h/2-4,size:fontSize,font:useFont,color:PDFLib.rgb(r,g,b)});
  }
  newDoc.addPage(pg);
 }
 const out=await newDoc.save(); const blob=new Blob([out],{type:'application/pdf'});
 const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='CARTELERA-V5-EXCEL.pdf'; a.click();
}
</script>
</body>
</html>
